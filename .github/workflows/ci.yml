name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,live,fastmcp]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Rules doc is current
        run: python scripts/gen_rules_doc.py --check
      - name: Test
        run: pytest -q

  core-only:
    # The core has no runtime dependencies; live/FastMCP tests must skip cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e . pytest hypothesis jsonschema
      - run: pytest -q -rs

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[live,fastmcp]"
      - name: Portable demo server passes
        run: mcpdialect check --cmd "python examples/demo_server.py --portable" -p gemini,anthropic,mcp
